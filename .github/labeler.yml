# Label definitions for Cut X Egypt storefront
# Used by actions/labeler@v5 — must use `changed-files` schema

# ─── Services ───────────────────────────────────────────
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'

# ─── Infrastructure / Config ────────────────────────────
ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'vercel.json'
          - 'netlify.toml'
          - '.releaserc.json'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/package.json'
          - '**/pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'

# ─── Documentation ──────────────────────────────────────
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '*.md'
          - 'CHANGELOG.md'

# ─── Areas (demo storefront — local auth / checkout UI only) ─
authentication:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/src/**/auth*'
          - 'frontend/src/**/login*'

payments:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/src/**/checkout*'
          - 'frontend/src/pages/checkout.tsx'
          - 'frontend/src/pages/success.tsx'
