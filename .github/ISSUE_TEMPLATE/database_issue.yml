name: Database issue (not applicable)
description: This repository has no database — use a bug report for storefront issues instead.
title: "[N/A] Database — "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **Cut X Egypt** is a **frontend-only demo storefront**.

        There is **no backend, PostgreSQL, Drizzle, or migrations** in this repository.
        Catalog data lives in `frontend/src/lib/data.ts`; cart/auth use browser storage.

        Please close this form and open a **Bug report** or **Feature request** instead.
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: If you believed a database existed, describe what you expected.
    validations:
      required: false
