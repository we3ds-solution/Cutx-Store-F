<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B1B20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101013;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGradient)"/>

  <!-- Subtle border -->
  <rect width="180" height="180" rx="36" fill="none" stroke="#333338" stroke-width="1" opacity="0.6"/>

  <!-- Cut X mark: bold red X -->
  <g transform="translate(90, 88)" stroke="#E10600" stroke-width="20" stroke-linecap="round">
    <line x1="-30" y1="-30" x2="30" y2="30"/>
    <line x1="30" y1="-30" x2="-30" y2="30"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" letter-spacing="6" fill="#ffffff">CUT X</text>
</svg>
