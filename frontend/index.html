<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO -->
    <title>Cut X Egypt — Cut-Resistant Apparel</title>
    <meta name="description" content="Cut X Egypt: cut and penetration resistant clothing for daily use, athletes and security teams. Browse the catalog in EGP, in English and Arabic." />
    <meta name="keywords" content="cut x, cut x egypt, cut-resistant clothing, protective apparel egypt, workwear egypt, athletic protection" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Cut X Egypt" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cut X Egypt" />
    <meta property="og:title" content="Cut X Egypt — Cut-Resistant Apparel" />
    <meta property="og:description" content="Cut and penetration resistant clothing for daily use, athletes and security teams across Egypt." />
    <meta property="og:image" content="/images/brand/social-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="634" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="ar_EG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cut X Egypt — Cut-Resistant Apparel" />
    <meta name="twitter:description" content="Cut-resistant apparel for daily life, sport and duty. Demo storefront in EGP." />
    <meta name="twitter:image" content="/images/brand/social-share.jpg" />

    <!-- Structured Data — only verified facts: name + public social pages -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Cut X Egypt",
      "description": "Cut and penetration resistant clothing for daily use, athletes and security teams.",
      "logo": "/favicon.svg",
      "sameAs": [
        "https://www.instagram.com/cutx_eg/",
        "https://www.facebook.com/p/Cut-X-100088062586202/"
      ]
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts: Cairo (universal font family across all languages).
         Non-blocking load: preconnect + print-media swap so first paint
         never waits on Google Fonts. System fonts render instantly until
         Cairo arrives (font-display: swap is set by Google). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Theme color -->
    <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
